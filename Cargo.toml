[package]
name = "tpsbar"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["PING"]
description = "A simple but effective TPS Bar plugin for Pumpkin servers."
license = "Apache-2.0"
keywords = ["minecraft", "pumpkin", "tps", "mspt", "bossbar"]
categories = ["game-development"]
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"

[dependencies]
pumpkin-plugin-api = { version = "0.1.0", git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "0844e929112d5cda772bc8b0de51e38930142704", package = "pumpkin-plugin-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tracing = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
