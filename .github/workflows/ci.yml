name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_LINE: v0.1

jobs:
  verify:
    name: Verify and build WASM
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --target x86_64-unknown-linux-gnu

      - name: Run Clippy
        run: cargo clippy --target x86_64-unknown-linux-gnu --all-targets -- -D warnings

      - name: Build release WASM
        run: cargo build --release --target wasm32-wasip2

      - name: Add version to WASM filename
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${{ env.RELEASE_LINE }}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          cp target/wasm32-wasip2/release/tpsbar.wasm "target/wasm32-wasip2/release/tpsbar-$version.wasm"

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: tpsbar-${{ steps.version.outputs.value }}-${{ github.sha }}
          path: target/wasm32-wasip2/release/tpsbar-${{ steps.version.outputs.value }}.wasm
          if-no-files-found: error
