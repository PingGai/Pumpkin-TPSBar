name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build WASM
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --target x86_64-unknown-linux-gnu

      - name: Run Clippy
        run: cargo clippy --target x86_64-unknown-linux-gnu --all-targets -- -D warnings

      - name: Build release WASM
        run: cargo build --release --target wasm32-wasip2

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: tpsbar-wasm-${{ github.sha }}
          path: target/wasm32-wasip2/release/tpsbar.wasm
          if-no-files-found: error
