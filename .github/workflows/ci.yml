name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build WASM
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --target x86_64-unknown-linux-gnu

      - name: Run Clippy
        run: cargo clippy --target x86_64-unknown-linux-gnu --all-targets -- -D warnings

      - name: Build versioned WASM
        id: artifact
        shell: pwsh
        run: |
          $releaseLine = (Get-Content -Raw -LiteralPath 'build/version.txt').Trim()
          $isReleaseTag = $env:GITHUB_REF_TYPE -eq 'tag'
          if ($isReleaseTag -and $env:GITHUB_REF_NAME -ne "v$releaseLine") {
            throw "Release tag $env:GITHUB_REF_NAME does not match v$releaseLine"
          }

          $outputDirectory = Join-Path 'target/ci-artifacts' $env:GITHUB_RUN_ID
          if ($isReleaseTag) {
            & ./build/build.ps1 -Release -OutputDirectory $outputDirectory
          } else {
            & ./build/build.ps1 -OutputDirectory $outputDirectory
          }
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 exited with code $LASTEXITCODE" }

          $artifact = Get-ChildItem -LiteralPath $outputDirectory -Filter 'tpsbar-*.wasm' | Select-Object -First 1
          if ($null -eq $artifact) { throw 'Build produced no tpsbar WASM artifact.' }
          $version = $artifact.BaseName.Substring('tpsbar-'.Length)
          "value=$version" >> $env:GITHUB_OUTPUT
          "path=$($artifact.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: tpsbar-${{ steps.artifact.outputs.value }}-${{ github.sha }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
